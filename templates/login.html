<!DOCTYPE html>
<html lang="es">
<head>
    <!-- CONFIGURACIÓN: Cambia el título aquí abajo -->
    {% set PAGE_TITLE = "BIN 1.0 | CLIENTE INF" %}
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ PAGE_TITLE }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0a1420; /* Azul marino profundo */
            color: #d1d9e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: #111d2d;
            border: 1px solid #2d4a6e;
            border-radius: 0;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header-stripe {
            border-bottom: 2px solid #336699;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
        }
        .title-text {
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            font-size: 1.1rem;
            text-transform: uppercase;
        }
        .form-control {
            background-color: #070d14;
            border: 1px solid #336699;
            color: #ffffff;
            border-radius: 0;
        }
        .form-control:focus {
            background-color: #070d14;
            color: #ffffff;
            border-color: #5599cc;
            outline: none;
            box-shadow: 0 0 5px rgba(85,153,204,0.5);
        }
        .btn-official {
            background-color: #1a3a5f;
            border: 1px solid #336699;
            color: #ffffff;
            border-radius: 0;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .btn-official:hover {
            background-color: #2d5a8c;
            color: #ffffff;
        }
        .warning-text {
            font-size: 0.65rem;
            color: #6688aa;
            text-align: center;
            margin-top: 1.5rem;
            line-height: 1.4;
        }
        .alert-error {
            background: #4a1919;
            border: 1px solid #7a2020;
            color: #ffcccc;
            font-size: 0.8rem;
            padding: 0.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header-stripe">
            <div class="title-text">{{ PAGE_TITLE }}</div>
        </div>

        {% if error %}
        <div class="alert alert-error" role="alert">
            [ACCESS_DENIED]: {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="mb-3">
                <label class="form-label small text-muted">AGENT_ID:</label>
                <input type="text" class="form-control" name="usuario" required autofocus autocomplete="off">
            </div>
            <div class="mb-4">
                <label class="form-label small text-muted">PASSCODE:</label>
                <input type="password" class="form-control" name="password" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-official">INGRESAR AL BIN</button>
            </div>
        </form>

        <div class="warning-text">
            [CUIDADO MENOL] EL USO NO AUTORIZADO PUEDE RESULTAR EN ACCIONES LEGALES. TE LO DICE DAMIAN 
        </div>
    </div>

</body>
</html>
