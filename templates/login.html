<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Privado | Administración Fundación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; }
        .login-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; color: white; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .form-control { background-color: #0f172a; border-color: #334155; color: white; border-radius: 8px; padding: 12px; }
        .form-control:focus { background-color: #0f172a; color: white; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
        .btn-primary { background-color: #0284c7; border: none; padding: 12px; font-weight: 600; border-radius: 8px; }
        .btn-primary:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <div class="login-card p-4 p-sm-5">
        <div class="text-center mb-4">
            <div class="d-inline-block bg-primary bg-opacity-10 p-3 rounded-circle text-info mb-3">
                <i class="bi bi-shield-lock-fill fs-1"></i>
            </div>
            <h4 class="fw-bold">Portal Administrativo</h4>
            <p class="text-secondary small">Fundación Solidaria - Acceso Restringido</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small border-0 text-center" style="background-color: #450a0a; color: #fca5a5;" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-secondary small fw-bold">Usuario Administrador</label>
                <input type="text" name="usuario" class="form-control" required placeholder="admin" autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small fw-bold">Contraseña</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100">
                Iniciar Sesión <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>
    </div>

</body>
</html>
